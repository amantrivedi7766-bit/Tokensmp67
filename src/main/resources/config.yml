# =====================================================================
#   TokenSMP - Enterprise Token SMP Plugin Configuration
#   Target: Paper / Spigot / Purpur 1.21+ (Java 21)
#
#   Every string, lore frame, color and numeric value below is fully
#   customizable. Reload at runtime with: /tokensadmin reload
# =====================================================================

settings:
  # Prefix prepended to most chat messages.
  prefix: "§8§l[§6§lTokenSMP§8§l]§r "
  # Task progress bar (used in lore and /token stats).
  progress-bar:
    length: 10
    filled-char: "█"
    empty-char: "░"
    filled-color: "§a"
    empty-color: "§7"
  # Live action-bar ability cooldown HUD (updates every 2 ticks).
  cooldown-bar:
    length: 16
    filled-char: "█"
    empty-char: "░"
    filled-color: "§c"
    format: "§cAbility Cooldown: [§c{bar}§r] §f{time}s"

messages:
  no-permission-admin: "§c[TokenSMP] You do not have permission to execute this administrative command."
  no-permission-player: "§c[TokenSMP] You do not have permission to use this command."
  players-only: "§cThis command can only be used by players."
  unknown-token: "§cUnknown token id: §f{token}"
  player-not-found: "§cPlayer §f{player} §cis not online."
  token-usage: "§eUsage: §f/token balance §7or §f/token stats"
  locked-token: "§cThis token is locked! Complete its unlock task first."
  token-activated: "§aActivated the {color}§l{name} Token§a! §7(Shift + Right Click to use its ability)"
  already-maxed: "§dThis token is already at MAX TIER!"
  upgrade-not-ready: "§cRequirements not met: complete the task and gather the materials!"
  ability-denied: "§c§l[!]§c Ability on cooldown! Wait {seconds}s"
  ability-activated: "§a§l[!] §2{ability} Activated!"
  ability-ready: "§a§l[!] §aAbility ready!"
  task-progress: "§e{token} task: §f{current}§7/§f{required}"
  task-complete: "§6🎯 Task complete! §e{token} §6can now be upgraded - open /tokens!"
  task-complete-bar: "§a✔ {token} task complete - upgrade it in /tokens!"
  already-unlocked: "§cYou have already unlocked the {token} Token!"
  token-given: "§aGave the {color}§l{name} Token §aitem to §f{player}§a."
  token-received: "§eYou received the {color}§l{name} Token §eitem! Right-click it to unlock."
  progress-set: "§aSet §f{token} §atask progress of §f{player} §ato §f{value}§a."
  force-upgraded: "§aForced §f{token} §aof §f{player} §ato Tier §f{tier}§a."
  cooldowns-reset: "§aCleared all token cooldowns for §f{player}§a."
  cooldowns-reset-target: "§aAll your token ability cooldowns have been reset!"
  config-reloaded: "§aConfiguration reloaded atomically (no reboot required)."
  balance-header: "§6§l🪙 Your Token Balance:"
  balance-entry: "§8- {color}§l{name} Token §7({tier}){active}"
  balance-active-marker: " §a✔ ACTIVE"
  balance-max-marker: "§5§lMAX"
  balance-empty: "§7You have not unlocked any tokens yet. Use §f/tokens §7to start grinding!"
  stats-header: "§6§l📊 Token Task Grinds:"
  stats-maxed: "    §d🌟 This token is fully maxed out!"
  stats-task: "    §7- Task: §f{task} §7[{bar}§r§7] §f{current}/{required}"

gui:
  selection:
    size: 54
    title: "§8Token SMP - Select Your Token"
    filler-material: GRAY_STAINED_GLASS_PANE
    filler-name: " "
    profile-name: "§b§lYour Token Profile"
    profile-lore-active: "§7Active Token: §a{token}"
    profile-lore-count: "§7Tokens Unlocked: §f{count}§7/§f{total}"
  upgrade:
    title: "§8Upgrade: {token_name} §7[Tier {tier}]"
    title-flash: "§6§lTIER {tier} REACHED!"
    subtitle-flash: "§7{color}§l{name} Token"
  spin:
    title: "§5§lUnlocking Token..."
    shifts-fast: 10          # shifts at 2 ticks each
    shifts-medium: 5         # shifts at 5 ticks each
    shifts-slow: 3           # shifts at 10 ticks each
    shifts-final: 2           # shifts at 15 ticks each (total ~5 seconds)
    title-unlocked: "§6§lTOKEN UNLOCKED"
    subtitle-unlocked: "§7Check your /tokens menu!"

lore:
  separator: "§8-----------------------------"
  locked-name: "§c§l[LOCKED] §7{token_name} Token"
  unlocked-name: "{rarity_color}§l{token_name} Token §e[Tier {current_tier}]"
  maxed-name: "§d§k§l!§5§l MAXED §d§k§l! {rarity_color}§l{token_name} Token §b[MAX TIER]"
  # ---------------- A. LOCKED ----------------
  locked:
    - "{separator}"
    - "§7Rarity: {rarity_color}{rarity}"
    - "{separator}"
    - "§e§l🔮 CURRENT STATUS:"
    - "§c❌ You have not unlocked this token yet!"
    - "{separator}"
    - "§6§l🎯 UNLOCK TASK:"
    - "§7- Progress: §c[{progress_bar}§r§c] {current}/{required} Kills"
    - "§7- Target Mob: §f{mob_name}"
    - "{separator}"
    - "§b§l⚡ FUTURE TIER 1 ABILITY:"
    - "§e✨ Type: §f{passive_type}"
    - "§e📝 Description: §7{ability_description}"
    - "§e⏳ Cooldown: §f{cooldown}s"
    - "{separator}"
  # ---------------- B. UNLOCKED (TIER 1-2) ----------------
  unlocked:
    - "{separator}"
    - "§7Rarity: {rarity_color}{rarity}"
    - "{separator}"
    - "§e§l🔮 CURRENT STATUS:"
    - "§a✅ Active Tier: §f{current_tier} / 3"
    - "§e✨ Active Effects: §7{passive_effects}"
    - "§b⚡ Active Ability: §f{ability_name} §7(Shift + Right Click)"
    - "§e📝 Ability Action: §7{ability_description}"
    - "§e⏳ Cooldown: §f{cooldown}s"
    - "{separator}"
    - "§6§l🚀 NEXT TIER UPGRADE TASK:"
    - "§7- Progress: §a[{progress_bar}§r§a] {current}/{required} Kills"
    - "§7- Required Items: §f{materials_list}"
    - "{separator}"
    - "§4§l🎁 NEXT TIER BENEFITS:"
    - "§7- Upgraded Ability: §f{next_ability_description}"
    - "§7- Enhanced Passives: §f{next_passive_description}"
    - "{separator}"
    - "§e⚡ Click to open Upgrade Menu!"
  # ---------------- C. MAX TIER (GOD MODE) ----------------
  maxed:
    - "{separator}"
    - "§7Rarity: {rarity_color}{rarity}"
    - "{separator}"
    - "§e§l🔮 CURRENT STATUS:"
    - "§a👑 Active Tier: §fMAX TIER (God Mode)"
    - "§e✨ Max Passives: §7{max_passive_effects}"
    - "§b⚡ Max Ability: §f{ability_name} §7(Shift + Right Click)"
    - "§e📝 Ultimate Action: §7{max_ability_description}"
    - "§e⏳ Cooldown: §f{cooldown}s"
    - "{separator}"
    - "§d🌟 THIS TOKEN IS FULLY MAXED OUT! 🌟"
    - "{separator}"

announcements:
  first-unlock: "§8§l[§6§lTokenSMP§8§l] §fPlayer §b{player} §fhas just unlocked the {color}§l{name} Token §ffor the first time! 🎉"
  upgrade: "§8§l[§6§lTokenSMP§8§l] §d§lUPGRADE! §b{player} §fhas successfully upgraded their {color}§l{name} Token §fto §e§lTier {tier}! 🚀"
  admin-alert: "§4§l[ADMIN ALERT] §cOperator §f{admin} §chas generated an §e§lOriginal Admin Token §cfor §f{target}§c."

freeze:
  frozen-message: "§b❄ You have been frozen for {seconds}s!"
  status-message: "§b❄ Frozen! §f{seconds}s"
  unfrozen-message: "§a❄ You are free again!"

# =====================================================================
#   TOKEN REGISTRY
#
#   Passive tokens:
#     STRENGTH:N / SPEED:N / NIGHT_VISION:N / REGENERATION:N /
#     FIRE_RESISTANCE:N / JUMP_BOOST:N / RESISTANCE:N / ABSORPTION:N
#     (N = amplifier; 0 = level I, 1 = level II, ...)
#     HEARTS:N               - +N extra hearts (+2N max HP)
#     BOW_DAMAGE:0.15         - +15% arrow damage
#     EXPLOSION_IMMUNITY:0.5  - 50% blast protection (1.0 = full immunity)
#     FALL_IMMUNITY           - 100% fall damage immunity
#     WALL_CLIMBING           - climb walls like a spider
#     FLIGHT                  - permanent survival flight
#     ARROW_TRAIL             - particles trailing every arrow you shoot
#     CLOUD_JUMPS             - cloud bursts when you jump
#
#   Ability types: ABSORPTION, SHOCKWAVE, EXPLOSION_NOVA, CHRONO_FREEZE,
#     SERVER_JUDGMENT, SONIC_BOOM, FIRE_NOVA, WARP_STRIKE, HEALING_MIST
#
#   Task types: KILLS, NETHER_KILLS, WITHER_STREAK, WARDEN_BAREHAND
# =====================================================================
tokens:

  zombie:
    name: "Zombie"
    rarity: "Common"
    rarity-color: "§a"
    material: ZOMBIE_HEAD
    slot: 10
    tiers:
      1:
        passives: ["STRENGTH:0", "NIGHT_VISION:0"]
        passive-description: "Strength I, Night Vision"
        task: {type: KILLS, mobs: [ZOMBIE], count: 1000, description: "Zombie"}
        cost: [{material: DIAMOND, amount: 32}]
      2:
        passives: ["STRENGTH:0", "NIGHT_VISION:0", "REGENERATION:0"]
        passive-description: "Strength I, Night Vision, Regeneration I"
        task: {type: KILLS, mobs: [ZOMBIE], count: 2500, description: "Zombie"}
        cost: [{material: DIAMOND, amount: 64}]
      3:
        passives: ["STRENGTH:1", "NIGHT_VISION:0", "REGENERATION:1"]
        passive-description: "Strength II, Night Vision, Regeneration II"
        ability:
          name: "Undead Enrage"
          type: ABSORPTION
          cooldown: 45
          duration: 15
          amplifier: 3
          description: "Gain 15s of Health Absorption IV."
        task: {type: KILLS, mobs: [ZOMBIE], count: 5000, description: "Zombie"}
        cost: [{material: NETHERITE_BLOCK, amount: 2}]

  skeleton:
    name: "Skeleton"
    rarity: "Common"
    rarity-color: "§a"
