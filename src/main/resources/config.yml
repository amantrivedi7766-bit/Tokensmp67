# ============================================================
#  TokenSMP V2 - Complete Token SMP Plugin Configuration
#  Paper / Spigot / Purpur 1.21+ | Java 21
#
#  Every gameplay value, message, GUI title and rule is
#  configurable here. Reload live with /tokensadmin reload
#  (atomic - invalid values keep the previous configuration).
# ============================================================

plugin:
  debug: false

# ------------------------------------------------------------
# First-join system: a new player waits EXACTLY delay-seconds
# (with preparation titles + countdown) before the spin starts.
# ------------------------------------------------------------
first-join:
  enabled: true
  delay-seconds: 60
  warning-seconds: 10
  resume-after-reconnect: true

# ------------------------------------------------------------
# Claim system: ONE PLAYER = ONE CLAIMED TOKEN.
# ------------------------------------------------------------
claim-system:
  one-active-token-only: true
  require-unclaim-before-claim: true

# ------------------------------------------------------------
# PvP token stealing (death claim system)
# ------------------------------------------------------------
token-stealing:
  enabled: true
  only-pvp: true
  require-killer-without-token: false
  steal-one-token-per-kill: true
  victim-keeps-progress: true
  victim-loses-active-state: true
  claim-timeout-seconds: 60
  # The Admin Token can NEVER be stolen unless this is true.
  allow-admin-token: false

# ------------------------------------------------------------
# Cinematic spin (2 -> 5 -> 10 -> 15 tick phases, ~5 seconds)
# ------------------------------------------------------------
spin:
  duration-seconds: 5
  fast-ticks: 2
  medium-ticks: 5
  slow-ticks: 10
  final-ticks: 15

# ------------------------------------------------------------
# Ability activation rules
# ------------------------------------------------------------
abilities:
  require-held-token: true
  require-shift-right-click: true

# ------------------------------------------------------------
# Performance
# ------------------------------------------------------------
performance:
  particle-view-distance: 32
  max-active-animations: 100

# ------------------------------------------------------------
# Token item behaviour
# ------------------------------------------------------------
settings:
  claim-gives-item: true
  unclaim-removes-item: true
  burning-aura-seconds: 4
  cooldown-bar:
    length: 16
    filled-char: "█"
    empty-char: "░"
    filled-color: "&c"
    format: "&cAbility Cooldown: [&c{bar}&r] &f{time}s"

# ------------------------------------------------------------
# Freeze status messages (Admin Token Chrono Freeze)
# ------------------------------------------------------------
freeze:
  frozen-message: "&b❄ You have been frozen for {seconds}s!"
  unfrozen-message: "&a❄ You are free again!"
  status-message: "&b❄ Frozen! &f{seconds}s"

# ------------------------------------------------------------
# GUI titles
# ------------------------------------------------------------
gui:
  selection:
    title: "&8Token Collection"
  player:
    title: "&8My Tokens &7(My Collection)"
  upgrade:
    title: "&8Upgrade: {token} &7[Tier {tier}]"
    title-flash: "&6&lTIER {tier} REACHED!"
  unclaim:
    title: "&8Unclaim {token}?"
  spin:
    title: "&5&lUnlocking Token..."
    title-unlocked: "&6&lTOKEN UNLOCKED"
    subtitle-unlocked: "&7Check your /tokens menu!"
    shifts-fast: 10
    shifts-medium: 5
    shifts-slow: 3
    shifts-final: 2
  admin:
    title: "&8TokenSMP &c&lADMIN"
    players-title: "&8Admin » Select Player"
    player-title: "&8Admin » {player}"
    tokens-title: "&8Admin » {player} » {action}"
    progress-title: "&8Progress » {player} » {token}"
    confirm-title: "&8Confirm: {action} {token}?"

