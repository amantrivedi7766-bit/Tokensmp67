# ============================================================
#  TokenSMP v5 - Enterprise Token SMP Plugin
#  Paper / Spigot / Purpur 1.21+ | Java 21
#
#  Every gameplay value, message, GUI title, engine toggle and
#  rule is configurable here. Reload live with /tokensadmin
#  reload (atomic - no server reboot required).
# ============================================================

# ------------------------------------------------------------
# Plugin core
# ------------------------------------------------------------
plugin:
  # Verbose diagnostic logging in the server console.
  debug: false

# ------------------------------------------------------------
# Permissions behaviour
# ------------------------------------------------------------
permissions:
  # true  -> server operators implicitly hold tokensmp.admin
  # false -> operators must still be granted tokensmp.admin
  op-implies-admin: true

# ------------------------------------------------------------
# Player command output options
# ------------------------------------------------------------
commands:
  # Show the "ACTIVE" marker next to claimed tokens in /token balance.
  balance-mark-active: true
  # Show [#####-------] progress bars in /token stats.
  stats-show-progress-bar: true

# ------------------------------------------------------------
# Colors (rarity color overrides used everywhere tokens render)
# ------------------------------------------------------------
colors:
  common: "&7"
  rare: "&9"
  epic: "&5"
  legendary: "&6"
  mythic: "&d"

# ------------------------------------------------------------
# Cinematic token spin (first-unlock crate animation)
# ------------------------------------------------------------
spin:
  title: "&5&lUnlocking Token..."
  title-allocated: "&6&lTOKEN ALLOCATED: &f{token} &6★"
  title-unlocked: "&6&lTOKEN UNLOCKED"
  subtitle-unlocked: "&7Check your /tokens menu!"
  # Shift counts per phase: fast (2 ticks) -> medium (5) -> slow (10) -> final (15).
  shifts-fast: 10
  shifts-medium: 5
  shifts-slow: 3
  shifts-final: 2

# ------------------------------------------------------------
# First-join spin
# ------------------------------------------------------------
first-join:
  enabled: true
  # Freeze the player and play the reveal before the spin.
  freeze: true
  freeze-seconds: 5.0
  title: "&f&lCHOOSING YOUR TOKEN..."
  subtitle: "&7The dice of destiny are rolling"
  # Delay before the spin launches after a first-ever join (client warm-up).
  launch-delay-ticks: 20

# ------------------------------------------------------------
# Cooldowns
# ------------------------------------------------------------
cooldowns:
  bar:
    length: 16
    filled-char: "█"
    empty-char: "░"
    filled-color: "&c"
    format: "&cAbility Cooldown: [&c{bar}&r] &f{time}s"
  # Play a small sound to the player when a cooldown finishes.
  ready-sound: true

# ------------------------------------------------------------
# Particle / sound engine master toggles
# ------------------------------------------------------------
particles:
  enabled: true

sounds:
  enabled: true

# ------------------------------------------------------------
# PvP token stealing (death claim system)
# ------------------------------------------------------------
token-stealing:
  enabled: true
  only-pvp: true
  require-killer-without-token: false
  steal-one-token-per-kill: true
  victim-keeps-progress: true
  victim-loses-active-state: true
  claim-timeout-seconds: 60
  # The Admin Token can NEVER be stolen unless this is true.
  allow-admin-token: false

# ------------------------------------------------------------
# Ground drop vortex (dropped token items)
# ------------------------------------------------------------
drop-animation:
  enabled: true
  lightning: true
  interval-ticks: 4
  radius: 0.8
  height: 2.0

# ------------------------------------------------------------
# Claim system
# ------------------------------------------------------------
claim-system:
  # Hand the token item to the player the moment a token is unlocked (spin), so
  # it lands in their hotbar. Holding it is how the ability is used.
  unlock-gives-item: true
  # Keep/ensure the token item when the token is claimed (never a duplicate).
  claim-gives-item: true
  # Remove the token item from the player when they unclaim?
  unclaim-removes-item: true

# ------------------------------------------------------------
# Grace period (admin controlled)
# ------------------------------------------------------------
grace-period:
  # Default length used when an admin starts it without a minute value.
  default-minutes: 30
  # Block player-vs-player damage while the grace period is running.
  block-pvp: true
  # Also block token abilities while the grace period is running.
  block-abilities: false

# ------------------------------------------------------------
# Cinematic Mode (big abilities)
# ------------------------------------------------------------
cinematic:
  enabled: true
  # Optional: the ability fires straight away, then the player gets a
  # clickable prompt and only sees the camera shot if they click it.
  optional: true
  # How long the clickable prompt stays valid.
  prompt-timeout-seconds: 8
  prompt: "&6&l✦ &e&l[ CLICK HERE TO WATCH THE CINEMATIC SHOT ] &6&l✦"
  prompt-hover: "&7Play the camera shot for &f{ability}"
  # Camera shot length in ticks (50 = 2.5 seconds).
  duration-ticks: 50
  # When the ability itself fires, as a fraction of the shot.
  peak-fraction: 0.4
  # Only these tokens get a cinematic camera shot (the "big" ones).
  tokens:
    - founder
    - admin
    - warden
    - ender_dragon
  # Slow-motion applied to nearby players during the shot.
  slow-motion:
    enabled: true
    radius: 20.0
    walk-speed: 0.05
    slowness-amplifier: 3
  title: "&6&l✦ CINEMATIC ✦"
  subtitle: "&7{token} &8» &f{ability}"
  bossbar: "&6&l✦ {token} &7- {ability}"

# ------------------------------------------------------------
# Lives + Revival Ritual
# ------------------------------------------------------------
lives:
  enabled: true
  # Lives every player starts with.
  starting-lives: 10
  # What happens when a player runs out of lives: BAN (kick + ban), SPECTATOR
  # (ghost mode) or NONE.
  elimination: BAN
  elimination-reason: "&cYou ran out of lives on TokenSMP! Craft a Revive Card to bring players back."
  # Hearts a revived player comes back with.
  revive-hearts: 3.0
  # Cooldown (seconds) between revivals for the player performing them.
  revive-cooldown-seconds: 300
  # Highest revive level allowed (each revive on the same player raises it).
  max-revive-level: 5
  # Permanent max hearts the reviver sacrifices per revive level above 1.
  heart-sacrifice-per-level: 1.0
  # The Revive Card item + its crafting recipe (8 outer + 1 center).
  revive-card:
    enabled: true
    name: "&d&lRevive Card"
    outer: SOUL_SAND
    center: NETHER_STAR

# ------------------------------------------------------------
# Upgrade system
# ------------------------------------------------------------
upgrade-system:
  # Require the tier task to be complete before upgrading.
  require-task: true
  # Require the material cost to be present before upgrading.
  require-materials: true

# ------------------------------------------------------------
# Chrono Freeze loop tuning
# ------------------------------------------------------------
freeze:
  frozen-message: "&b❄ You have been frozen for {seconds}s!"
  unfrozen-message: "&a❄ You are free again!"
  status-message: "&b❄ Frozen! &f{seconds}s"

# ------------------------------------------------------------
# GUI titles
# ------------------------------------------------------------
gui:
  selection:
    title: "&8Token Collection"
  player:
    title: "&8My Tokens &7(My Collection)"
  upgrade:
    title: "&8Upgrade: {token} &7[Tier {tier}]"
    title-flash: "&6&lTIER {tier} REACHED!"
  unclaim:
    title: "&8Unclaim {token}?"
  revival:
    title: "&d&lRevival Altar"
  ender-assembly:
    title-source: "&5Ender Assembly &8» &7Who to teleport?"
    title-destination: "&5Ender Assembly &8» &7Pick the destination"
  admin:
    title: "&8TokenSMP &c&lADMIN"
    players-title: "&8Admin » Select Player"
    player-title: "&8Admin » {player}"
    tokens-title: "&8Admin » {player} » {action}"
    progress-title: "&8Progress » {player} » {token}"
    confirm-title: "&8Confirm: {action} {token}?"

# ------------------------------------------------------------
# Admin behaviour
# ------------------------------------------------------------
admin:
  # Broadcast the [ADMIN ALERT] server-wide whenever the Admin Token is given.
  give-alert-broadcast: true
  # Mirror every /tokensadmin action to the server console.
  log-actions: true

# ------------------------------------------------------------
# Performance
# ------------------------------------------------------------
performance:
  # Action bar HUD refresh rate for ability cooldowns (in ticks).
  cooldown-hud-interval-ticks: 2
  # Hard cap of particles a single effect may spawn per call.
  max-particles-per-effect: 128

