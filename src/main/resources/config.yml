# ============================================================
#  TokenSMP v3 - Enterprise Token SMP Plugin
#  Paper / Spigot / Purpur 1.21+ | Java 21
#
#  Every gameplay value, message, GUI title and rule is
#  configurable here. Reload live with /tokensadmin reload
#  (atomic - no server reboot required).
# ============================================================

settings:
  # Give a PDC-tagged token item when a token is claimed?
  claim-gives-item: true
  # Remove the token item from the player when they unclaim?
  unclaim-removes-item: true
  # Seconds attackers burn when hitting a Burning Aura holder.
  burning-aura-seconds: 4
  cooldown-bar:
    length: 16
    filled-char: "█"
    empty-char: "░"
    filled-color: "&c"
    format: "&cAbility Cooldown: [&c{bar}&r] &f{time}s"

# ------------------------------------------------------------
# PvP token stealing (death claim system)
# ------------------------------------------------------------
token-stealing:
  enabled: true
  only-pvp: true
  require-killer-without-token: false
  steal-one-token-per-kill: true
  victim-keeps-progress: true
  victim-loses-active-state: true
  claim-timeout-seconds: 60
  # The Admin Token can NEVER be stolen unless this is true.
  allow-admin-token: false

# ------------------------------------------------------------
# Chrono Freeze loop tuning
# ------------------------------------------------------------
freeze:
  frozen-message: "&b❄ You have been frozen for {seconds}s!"
  unfrozen-message: "&a❄ You are free again!"
  status-message: "&b❄ Frozen! &f{seconds}s"

# ------------------------------------------------------------
# GUI titles
# ------------------------------------------------------------
gui:
  selection:
    title: "&8Token Collection"
  player:
    title: "&8My Tokens &7(My Collection)"
  upgrade:
    title: "&8Upgrade: {token} &7[Tier {tier}]"
    title-flash: "&6&lTIER {tier} REACHED!"
  unclaim:
    title: "&8Unclaim {token}?"
  spin:
    title: "&5&lUnlocking Token..."
    title-unlocked: "&6&lTOKEN UNLOCKED"
    subtitle-unlocked: "&7Check your /tokens menu!"
    shifts-fast: 10
    shifts-medium: 5
    shifts-slow: 3
    shifts-final: 2
  admin:
    title: "&8TokenSMP &c&lADMIN"
    players-title: "&8Admin » Select Player"
    player-title: "&8Admin » {player}"
    tokens-title: "&8Admin » {player} » {action}"
    progress-title: "&8Progress » {player} » {token}"
    confirm-title: "&8Confirm: {action} {token}?"

# ------------------------------------------------------------
# Token gameplay values (tier tasks, costs and ability numbers)
# The token identity (rarity, passives, abilities) is defined by
# the code; every NUMBER below overrides the defaults.
# ------------------------------------------------------------
tokens:
  zombie:
    tier1:
      task-count: 1000
      cost-diamonds: 32
    tier2:
      task-count: 2500
      cost-diamonds: 64
    tier3:
      task-count: 5000
      ability-cooldown: 45
      ability-duration: 15
      ability-amplifier: 3
      cost-netherite-blocks: 2
  skeleton:
    tier1:
      task-count: 800
      cost-bones: 64
    tier2:
      task-count: 2000
      cost-diamonds: 16
    tier3:
      task-count: 4500
      cost-netherite-ingots: 4
  spider:
    tier1:
      task-count: 500
      cost-string: 64
    tier2:
      task-count: 1500
      cost-spider-eyes: 32
    tier3:
      task-count: 3000
      cost-slime-blocks: 8
  creeper:
    tier1:
      task-count: 300
      cost-gunpowder: 64
    tier2:
      task-count: 800
      cost-tnt: 16
    tier3:
      task-count: 2000
      ability-cooldown: 60
      ability-radius: 6
      ability-damage: 14
      ability-knockback: 2.0
      cost-netherite-ingots: 4
  enderman:
    tier1:
      task-count: 400
      cost-ender-eyes: 16
    tier2:
      task-count: 1000
      cost-ender-pearls: 32
    tier3:
      task-count: 2500
      ability-cooldown: 40
      ability-radius: 10
      ability-damage: 12
      cost-netherite-ingots: 4
  blaze:
    tier1:
      task-count: 350
      cost-blaze-rods: 32
    tier2:
      task-count: 900
      cost-magma-cream: 32
    tier3:
      task-count: 2200
      ability-cooldown: 50
      ability-radius: 7
      ability-damage: 10
      ability-burn-seconds: 5
      cost-netherite-ingots: 4
  warden:
    tier1:
      task-count: 25
      extra-hearts: 5
      cost-echo-shards: 16
    tier2:
      task-count: 60
      extra-hearts: 10
      cost-echo-shards: 32
      cost-diamonds: 16
    tier3:
      task-count: 100
      extra-hearts: 15
      ability-cooldown: 90
      ability-damage: 25
      ability-knockback: 3.0
      cost-netherite-ingots: 4
      cost-sculk: 64
  # ADMIN TOKEN - absolutely isolated. Only /tokensadmin give <player> admin
  # can ever generate it. It never appears in GUIs, spins or stats.
  admin:
    tier1:
      task-count: 5000
      ability-cooldown: 45
      ability-radius: 15
      ability-damage: 10
      ability-knockback: 1.5
      cost-netherite-blocks: 4
    tier2:
      extra-hearts: 10
      ability-cooldown: 60
      ability-radius: 10
      ability-duration: 7
      cost-diamond-blocks: 8
      cost-dragons-breath: 1
    tier3:
      extra-hearts: 20
      ability-cooldown: 30
      ability-damage: 35
      ability-knockback: 20
      cost-dragon-eggs: 1
      cost-netherite-blocks: 4
      cost-god-apples: 1

