name: TokenSMP
version: 4.0.0
main: com.tokensmp.TokenSMP
api-version: '1.21'
author: amantrivedi7766-bit
description: TokenSMP V2 - 20 unique player tokens x 3 tiers, ONE active token per player, holdable PDC token items, 60-second first-join spins, physical combat abilities, PvP token stealing and full admin tooling.
website: https://github.com/amantrivedi7766-bit/Tokensmp67
folia-supported: false

commands:
  token:
    description: Main player token command - menu, balance and stats.
    usage: /token [menu|balance|stats]
    aliases: [tokens, tsmp]
    permission: tokensmp.player
  tokensadmin:
    description: Administrative TokenSMP command (GUI + full registry).
    usage: /tokensadmin [give|spin|setprogress|forceupgrade|resetcooldown|claim|unclaim|remove|inspect|reload]
    aliases: [tsmpadmin]
    permission: tokensmp.admin

permissions:
  tokensmp.player:
    description: Access to /token and the token GUIs.
    default: true
  tokensmp.admin:
    description: Access to /tokensadmin, the admin GUI and the Admin Token.
    default: op
