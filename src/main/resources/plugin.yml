name: TokenSMP
version: '${version}'
main: com.tokensmp.TokenSMP
api-version: '1.21'
author: amantrivedi7766-bit
description: Enterprise-grade Token SMP plugin - 8 player tokens x 3 tiers, spin unlocks, claim/unclaim, PvP token stealing, cinematic abilities and full admin tooling.
website: https://github.com/amantrivedi7766-bit/Tokensmp67
folia-supported: false

commands:
  token:
    description: Player token hub - menu, balance, list, stats, trust, revive.
    usage: /token <menu|balance|list|stats|trust|untrust|revive>
    permission: tokensmp.player
  tokens:
    description: Opens the interactive token GUI.
    usage: /tokens
    aliases: [tokengui]
    permission: tokensmp.player
  bal:
    description: Shows your token balance and progress.
    usage: /bal
    permission: tokensmp.player
  ability:
    description: Activate a token's ability or check cooldowns.
    usage: /ability <activate <token>|cooldowns>
    permission: tokensmp.player
  cooldown:
    description: Admin - enable/disable a player's ability cooldowns.
    usage: /cooldown <player>
    permission: tokensmp.admin
  tokencinematic:
    description: Plays the optional cinematic camera shot (clickable prompt).
    usage: /tokencinematic
    permission: tokensmp.player
  tokensadmin:
    description: Administrative TokenSMP command (GUI + full registry).
    usage: /tokensadmin [give|giveitem|giveall|take|takeall|check|setprogress|setlives|togglecooldown|reload]
    aliases: [tsmpadmin]
    permission: tokensmp.admin

permissions:
  tokensmp.player:
    description: Access to /token and the token GUIs.
    default: true
  tokensmp.admin:
    description: Access to /tokensadmin, the admin GUI and the Admin Token.
    default: op
